name: NHL API Check

on:
  schedule:
    - cron: '0 12 * * *'  # Run daily at 12:00 UTC
  workflow_dispatch:  # Allow manual triggering

permissions:
  contents: read
  issues: write

jobs:
  check-api:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1.327.0
        with:
          bundler-cache: true

      - name: Check NHL API for schema changes
        id: check-api
        run: bundle exec ruby .github/scripts/check_api.rb

      - name: Send notification if API changed
        if: ${{ failure() && steps.check-api.outcome == 'failure' }}
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '⚠️ NHL API validation failed',
              body: `The NHL API check failed. Check the [workflow logs](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}) to distinguish an HTTP failure from a schema change.`
            })
